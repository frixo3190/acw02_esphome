esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly}
  platformio_options:
    build_flags:
      - -DDLOCALE_LANG=\"${lang}\"
      - -DDBOARD=\"${board}\"

esp32:
  board: ${board}
  framework:
    type: esp-idf

web_server:
  port: 80
  auth:
    username: ${web_server_username}
    password: ${web_server_password}
  version: 3
  log: true
  local : true
  include_internal: true
  
logger:
  hardware_uart: UART0
  baud_rate: 0
  level: DEBUG
  
api:
  encryption:
    key: ${api_encrypted_key}
  reboot_timeout: 0s #in test for not forcing using esphome native

ota:
  - platform: esphome
    password: ${ota_password}
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Configuration IP Statique
  # manual_ip:
  #   static_ip: 192.168.70.14
  #   gateway: 192.168.70.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.70.1  # Souvent l'IP du routeur

mqtt:
  broker: "" 
  username: ""
  password: ""
  enable_on_boot: false
  discovery: false
  keepalive: 30s
  log_topic: null
  clean_session: false
  idf_send_async: false
  wait_for_connection: false
  topic_prefix: ${dev_name}
  birth_message:
    topic: ${dev_name}/status
    payload: online

  will_message:
    topic: ${dev_name}/status
    payload: offline

captive_portal:

uart:
  id: uart_acw02
  tx_pin: ${RX}
  rx_pin: ${TX}
  baud_rate: 115200
  #marche pas 9600  57600  115200
  # stop_bits: 1
  # rx_buffer_size: 1024
  debug:
    direction: BOTH
    dummy_receiver: false

tuya:
climate:
  - platform: tuya
    id: acw02
    name: "Climatiseur"
    switch_datapoint: 1
    supports_heat: true
    supports_cool: true
    target_temperature_datapoint: 2
    current_temperature_datapoint: 3
    temperature_multiplier: 0.1
    on_state:
      - lambda: |-
          if (x.target_temperature < 10) {
            id(acw02).target_temperature = x.target_temperature * 10;
          }
    visual:
      min_temperature: 16
      max_temperature: 31
      temperature_step: 1
    active_state:
      datapoint: 4
      heating_value: 3
      cooling_value: 1
      drying_value: 2
      fanonly_value: 4
select:
  - platform: tuya
    name: "Ventilation"
    enum_datapoint: 5
    options:
      0: "Auto"
      1: "20%"
      2: "40%"
      3: "60%"
      4: "80%"
      5: "100%"
      6: "Silencieux"
      7: "Turbo"
  - platform: "tuya"
    name: "Oscillation Vertical"
    enum_datapoint: 107
    options:
      0: "Désactivé"
      1: "Activé"
      2: "Position 1"
      3: "Position 2"
      4: "Position 3"
      5: "Position 4"
      6: "Position 5"  
  - platform: "tuya"
    name: "Unité"
    enum_datapoint: 105
    options:
      0: "°C"
      1: "°F"
  - platform: "tuya"
    name: "Oscillation Horizontal"
    enum_datapoint: 106
    options:
      0: "Désactivé"
      1: "Activé"

switch:
  - platform: "tuya"
    name: "Affichage"
    switch_datapoint: 13
  - platform: "tuya"
    name: "Purificateur"
    switch_datapoint: 110
  - platform: "tuya"
    name: "Nuit"
    switch_datapoint: 109