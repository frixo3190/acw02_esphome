substitutions:
  dev_name: clim-rdc-extension
  dev_friendly: clim extension salon
  lang: "fr"
  api_encrypted_key: "+4Y9UtfgruQGKwKdOfNrvIAG2BqTfiu6Y64JSn4wwWQ="
  ota_password: "motdepasseclim!"
  ap_password: "fallbackpassword"
  web_server_username: admin
  web_server_password: admin
  # ESP32 D1 mini WROOM 32
  board: esp32dev
  TX: GPIO17
  RX: GPIO16
  
  ## LOLIN ESP32 C3 MINI
