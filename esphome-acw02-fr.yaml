esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly}
  platformio_options:
    build_flags:
      - -DDLOCALE_LANG=\"${lang}\"
      - -DDBOARD=\"${board}\"

esp32:
  board: ${board}
  framework:
    type: esp-idf

web_server:
  port: 80
  auth:
    username: ${web_server_username}
    password: ${web_server_password}
  version: 3
  log: true
  local : true
  include_internal: true
  
logger:
  level: DEBUG
  
api:
  encryption:
    key: ${api_encrypted_key}
  reboot_timeout: 0s #in test for not forcing using esphome native

ota:
  - platform: esphome
    password: ${ota_password}
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid2
  #     password: !secret wifi_password2
  #   - ssid: !secret wifi_ssid3
  #     password: !secret wifi_password3
  ap:
    ssid: ${dev_friendly}
    password: ${ap_password}



captive_portal:

uart:
  id: uart_acw02
  tx_pin: ${RX}
  rx_pin: ${TX}
  baud_rate: 115200
  rx_buffer_size: 1024
  #marche pas 9600  57600  115200
  # stop_bits: 1
  # rx_buffer_size: 1024
  debug:
    direction: BOTH
    dummy_receiver: false

