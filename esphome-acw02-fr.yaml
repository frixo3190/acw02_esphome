substitutions:
  dev_name: acw02-salon
  dev_friendly: ACW02 salon
  lang: "fr"
  api_encrypted_key: "D2oldc0VP++fni6src89tCSC0UwBhNPgyc8vgYN8/mA="
  ota_password: "motdepasseclim!"
  ap_password: "fallbackpassword"
  web_server_username: admin
  web_server_password: admin
  board: d1_mini

esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly}
  platformio_options:
    build_flags:
      - -DDLOCALE_LANG=\"${lang}\"
      - -DDBOARD=\"${board}\"

esp8266:
  board: ${board}
  restore_from_flash: false

web_server:
  port: 80
  auth:
    username: ${web_server_username}
    password: ${web_server_password}
  version: 3
  log: true
  local : true
  include_internal: true
  
logger:
  level: DEBUG
  baud_rate: 460800
  


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: high
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid2
  #     password: !secret wifi_password2
  #   - ssid: !secret wifi_ssid3
  #     password: !secret wifi_password3
  ap:
    ssid: ${dev_friendly}
    password: ${ap_password}

mqtt:
  broker: "" 
  username: ""
  password: ""
  enable_on_boot: false
  discovery: false
  topic_prefix: ${dev_name}
  birth_message:
    topic: ${dev_name}/status
    payload: online

  will_message:
    topic: ${dev_name}/status
    payload: offline

captive_portal:

uart:
  id: uart_acw02
  tx_pin: GPIO1 #GPIO17
  rx_pin: GPIO3 #GPIO16
  baud_rate: 9600
  stop_bits: 1
  rx_buffer_size: 1024

external_components:
  - source:
      type: local
      path: components

packages:
  acw02_entities: !include components/acw02/acw02_fr.yaml
  
acw02:
  id: ac_ctrl
  uart_id: uart_acw02
